name: API security regression tests

on:
  pull_request:
  push:
    branches: [main, feature/android-foundation]

jobs:
  api-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API dependencies
        run: pip install -r requirements.txt
      - name: Run isolated security tests
        env:
          PYTHONPATH: .
          FIELDHUB_OIDC_ISSUER: http://localhost:8080/realms/fieldhub
          FIELDHUB_OIDC_AUDIENCE: fieldhub-api
          FIELDHUB_OIDC_JWKS_URL: http://keycloak:8080/realms/fieldhub/protocol/openid-connect/certs
        run: python -m pytest -q -p no:cacheprovider tests/test_security_roles.py tests/test_security_auth_invitations.py
