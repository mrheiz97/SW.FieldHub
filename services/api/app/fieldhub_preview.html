<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldHub</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0f121b;color:#f3f3f8}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#171b27;border-right:1px solid #303446;padding:24px}main{padding:36px clamp(20px,5vw,80px)}.brand{font-size:24px;font-weight:800;letter-spacing:-1px}.brand span{color:#ae9bff}.small{color:#a7adbd;font-size:13px}h1{font-size:38px;letter-spacing:-1px}button,select,input{font:inherit;color:inherit;background:#252a3a;border:1px solid #41465b;border-radius:10px;padding:12px;cursor:pointer}select,input{width:100%;margin:12px 0}nav{display:grid;gap:8px;margin-top:28px}nav button{text-align:left;border:0;background:transparent}nav button.active,nav button:hover{background:#342d4d;color:#e4dcff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card,.panel{border:1px solid #34394a;background:#191e2c;border-radius:16px;padding:24px}.card{text-align:left;min-height:150px}.card strong{display:block;font-size:20px;margin:14px 0 7px}.card span{color:#b3bbca}.row{padding:16px 0;border-bottom:1px solid #333849}.hidden{display:none}.toolbar{display:flex;gap:10px;justify-content:flex-end}.section-label{color:#a7adbd;font-size:12px;text-transform:uppercase;letter-spacing:1.6px;margin:28px 0 14px}.card:before{content:"◈";display:block;color:#b4a1ff;font-size:28px}.card:hover{border-color:#8875c9;transform:translateY(-2px)}.card{transition:transform .15s,border-color .15s}.pill{display:inline-block;padding:5px 10px;border:1px solid #45405c;border-radius:30px;color:#c3b5ff;font-size:12px}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid #34394a}.switchrow button{min-width:115px}.subtitle{color:#a7adbd;margin:0 0 26px}.welcome{background:linear-gradient(110deg,#24233d,#191e2c 65%);border:1px solid #403858;border-radius:18px;padding:28px;margin-bottom:28px}.welcome h2{margin:8px 0;font-size:26px}.welcome p{margin:0;color:#b6bbcb}.login{max-width:540px;margin:12vh auto;padding:30px}.error{color:#ffb7b7;white-space:pre-wrap}@media(max-width:700px){.shell{display:block}aside{padding:16px}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap}main{padding:20px}h1{font-size:29px}}
</style></head><body>
<section id="login" class="panel login"><div class="brand">stumpf<span>WORKS</span> FieldHub</div><h1>Willkommen.</h1><p class="small">Lokale Web-Vorschau. Melde dich zunächst im Keycloak-Test an und öffne die Vorschau von dort. Alternativ einen kurzlebigen Access-Token für diese Sitzung eingeben.</p><input id="token" type="password" placeholder="Access-Token" autocomplete="off"><button id="connect">Verbinden</button> <a href="/dev/login">Zum Login</a><p id="loginError" class="error"></p></section>
<div id="app" class="shell hidden"><aside><div class="brand">stumpf<span>WORKS</span></div><p class="small">FIELDHUB</p><select id="workspaces" aria-label="Workspace"></select><nav id="nav"></nav></aside><main><div class="toolbar"><button id="refresh">Aktualisieren</button><button id="signout">Abmelden</button></div><p class="small" id="workspaceName"></p><h1 id="heading">Dashboard</h1><p id="message" class="small" role="status"></p><section id="content"></section></main></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem("fh_web_token")||"",bootstrap,ui,workspace,active="dashboard";
function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text||"";if(cls)x.className=cls;return x}
async function api(path,method="GET",body){const r=await fetch(path,{method,headers:{Authorization:"Bearer "+token,...(body===undefined?{}:{"Content-Type":"application/json"})},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});if(!r.ok)throw Error("API "+r.status);return r.json()}
async function connect(){try{token=$("token").value.trim()||token;bootstrap=await api("/v1/bootstrap");sessionStorage.setItem("fh_web_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");$("workspaces").replaceChildren();for(const w of bootstrap.workspaces){const o=el("option",w.name);o.value=w.id;$("workspaces").append(o)}if(!bootstrap.workspaces.length){$("message").textContent="Keine Workspaces zugeordnet";return}workspace=bootstrap.workspaces.find(w=>w.id===sessionStorage.getItem("fh_last_workspace"))?.id||bootstrap.workspaces[0].id;$("workspaces").value=workspace;await load()}catch(e){$("loginError").textContent=e.message}}
async function load(){try{workspace=$("workspaces").value;sessionStorage.setItem("fh_last_workspace",workspace);ui=await api("/v1/workspaces/"+encodeURIComponent(workspace)+"/ui");active="dashboard";render()}catch(e){$("message").textContent=e.message}}
function render(){const w=bootstrap.workspaces.find(x=>x.id===workspace);$("workspaceName").textContent=w?.name||workspace;const nav=$("nav"),content=$("content");nav.replaceChildren();content.replaceChildren();for(const item of [{id:"dashboard",label:"Übersicht"},...ui.navigation.map(x=>({...x,label:({Forms:"Formulare",Members:"Mitglieder",Roles:"Rollen"})[x.label]||x.label})),...(w?.permissions.includes("workspace.manage")?[{id:"settings",label:"Module & Einstellungen"}]:[])]){const b=el("button",item.label,item.id===active?"active":"");b.onclick=()=>{active=item.id;render()};nav.append(b)}
if(active==="dashboard"){$("heading").textContent="Dashboard";const grid=el("div","","cards");for(const card of ui.dashboard.cards){if(card.type!=="navigation-card")continue;const b=el("button","","card");b.append(el("strong",card.title),el("span",card.description));b.onclick=()=>{active=card.target;render()};grid.append(b)}content.append(grid);return}
const page=ui.pages.find(p=>p.id===active);if(!page)return;$("heading").textContent=page.title;for(const c of page.components){if(c.type!=="resource-list")continue;const panel=el("section","","panel");panel.append(el("h2",c.title));const list=el("div","Lade…");panel.append(list);content.append(panel);if(!["forms","members","roles"].includes(c.resource))continue;api("/v1/workspaces/"+encodeURIComponent(workspace)+"/"+c.resource).then(data=>{list.replaceChildren();for(const item of data.items||[])list.append(el("div",item.title||item.name||item.subject||item.id,"row"));if(!list.childElementCount)list.textContent="Keine Einträge vorhanden"}).catch(e=>list.textContent="Fehler: "+e.message)}}
$("connect").onclick=connect;$("workspaces").onchange=load;$("refresh").onclick=load;$("signout").onclick=()=>{sessionStorage.removeItem("fh_web_token");location.reload()};if(token)connect();
</script></body></html>
