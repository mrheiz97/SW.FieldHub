services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldhub
      POSTGRES_USER: fieldhub
      POSTGRES_PASSWORD: ${FIELDHUB_DB_PASSWORD:?Set FIELDHUB_DB_PASSWORD}
    volumes:
      - fieldhub_pg:/var/lib/postgresql/data
      - ../../services/api/sql/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldhub -d fieldhub"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ../../services/api
    restart: unless-stopped
    environment:
      FIELDHUB_DATABASE_URL: postgresql+psycopg://fieldhub:${FIELDHUB_DB_PASSWORD}@db:5432/fieldhub
      FIELDHUB_OIDC_ISSUER: ${FIELDHUB_OIDC_ISSUER:?Set OIDC issuer}
      FIELDHUB_OIDC_AUDIENCE: ${FIELDHUB_OIDC_AUDIENCE:?Set OIDC audience}
      FIELDHUB_OIDC_JWKS_URL: ${FIELDHUB_OIDC_JWKS_URL:?Set JWKS URL}
      FIELDHUB_LOCAL_DEV_HTTP_JWKS: ${FIELDHUB_LOCAL_DEV_HTTP_JWKS:-false}
      FIELDHUB_LOCAL_DEV_LOGIN: ${FIELDHUB_LOCAL_DEV_LOGIN:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  web-session:
    profiles: ["web-preview"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
  web-bff:
    profiles: ["web-preview"]
    build: ../../apps/web/bff
    restart: unless-stopped
    environment:
      BFF_OIDC_ISSUER: ${FIELDHUB_OIDC_ISSUER:?Set OIDC issuer}
      BFF_OIDC_TOKEN_URL: ${FIELDHUB_BFF_TOKEN_URL:-http://keycloak:8080/realms/fieldhub/protocol/openid-connect/token}
      BFF_OIDC_JWKS_URL: ${FIELDHUB_OIDC_JWKS_URL:?Set JWKS URL}
      BFF_OIDC_CLIENT_ID: fieldhub-web-dev
      BFF_REDIRECT_URI: http://127.0.0.1:8090/auth/callback
      BFF_SECURE_COOKIES: "false"
      BFF_REDIS_URL: redis://web-session:6379/0
      BFF_API_URL: http://api:8000
    depends_on:
      - api
      - web-session
  web:
    profiles: ["web-preview"]
    build: ../../apps/web
    depends_on:
      - web-bff
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
volumes:
  fieldhub_pg:
